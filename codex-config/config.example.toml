# Minimal shareable subset of the personal Codex configuration.
# Merge desired sections into ~/.codex/config.toml.

model = "gpt-6.2-astra"
model_reasoning_effort = "medium"

[agents]
max_threads = 3

[agents.sol_worker]
description = "Cross-file implementation, call-chain tracing, and root-cause fixes."
config_file = "sol-worker.config.toml"

[agents.luna_worker]
description = "Bounded local edits and mechanical follow-ups."
config_file = "luna-worker.config.toml"
